<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackJack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="titulo">
        BlackJack
    </header>
    <div class="row mt-2">
        <div class="col text-center">
            <button id="btn-pedir" class="btn btn-primary">Pedir carta</button>
            <button id="btn-detener" class="btn btn-primary">Detener</button>
            <button id="btn-nuevo" class="btn btn-danger">Nuevo juego</button>
        </div>
    </div>
    <div class="row container">
        <div class="col">
            <h1>Jugador 1 - <small>0</small></h1>
            <div id="jugador-cartas">
                <aside class="perdiste"> <h1>Lo siento. Perdiste el juego</h1> </aside>
                <aside class="ganaste"> <h1>Felicidades. Ganaste el juego</h1> </aside>
                <!--<img src="assets/cartas/cartas/10D.png" alt="" class="carta">-->
            </div>
        </div>
    </div>
    <div class="row container mt-2">
        <div class="col">
            <h1>Computadora - <small>0</small></h1>
            <div id="computadora-cartas">
                
            </div>
        </div>
    </div>

    <script src="assets/js/underscore-min.js" ></script>
    <script src="assets/js/juego.js" type="module"></script>
</body>
</html>
